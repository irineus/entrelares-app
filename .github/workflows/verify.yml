# T-54 — the repo's gate: analyze + tests on every push/PR.
# T-53 stage 4 added the `deploy-web` job at the bottom: the web channel is
# PUBLISHED from here, and only behind a green gate — nothing reaches a user that
# the suites have not seen. Since 24/08/2026 that gate is THREE jobs: `verify` (the
# Flutter suites), `db-gate` (the database rules that moved here from
# `entrelares-app`) and `web-e2e` (the flow gate that replaces the Playwright
# suite dying with the Blazor client). `deploy-web` waits on all three, plus
# `db-prod` — T-29's order, migrations → functions → app.
# The APK build and the E2E emulator lane stay OUT of the gate on purpose: both
# are minutes-expensive and the account's 2000 min/mo are shared with the
# product repos (same constraint that shaped T-50). The E2E lane runs daily on
# a schedule and on demand; an APK comes from workflow_dispatch.
name: verify

# A change that touches ONLY markdown runs nothing (`paths-ignore`, 29/08/2026).
# The saving is not the three minutes of `verify`: it is `db-gate`, which holds a
# REPO-WIDE serialized concurrency group, so a docs PR sitting in that queue is
# what makes a third claimant get evicted (the episode `CLAUDE.md` documents) —
# and `web-e2e`, which spins a throwaway family on the shared dev project to
# prove nothing about a paragraph.
#
# Two things make this safe, and both are guarded rather than assumed, in
# `web_channel_test.dart` next to the other assertions about this file:
#   1. NO suite reads a `.md`. The moment one does, this filter would make it a
#      test that silently stops running — the vacuous green T-58 exists about.
#      A test asserts that no suite reads one.
#   2. NOTHING under `app/web/` is markdown. Everything there is
#      copied verbatim into the published build, so a `.md` in that directory
#      WOULD be user-facing and must not skip the deploy.
#
# `schedule` and `workflow_dispatch` carry no path filter, so the daily E2E lane
# and any manual run are unaffected — that is also the escape hatch for forcing
# a full run over a docs-only branch.
#
# Note this repo has neither branch protection nor a ruleset (checked
# 29/08/2026). If `verify` is ever made a REQUIRED check, revisit: a workflow
# that never runs reports no status, and a docs-only PR would sit unmergeable.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  # T-53 lote 3: the E2E lane runs on a schedule, not on every push — an
  # emulator run costs ~10-15 min of the account-wide 2000 min/mo (the same
  # constraint that keeps the APK build out of the gate). 06:10 UTC daily.
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      build-apk:
        description: "Also build the debug APK (arm64, split-per-abi)"
        type: boolean
        default: false
      run-e2e:
        description: "Also run the E2E lane on an emulator (two-user swap flow)"
        type: boolean
        default: false
      e2e-pack:
        description: "E2E pack: p0 (smoke) or full"
        type: choice
        options: [p0, full]
        default: p0

# NO workflow-level `concurrency` — deliberately, since 24/08/2026 (T-56).
#
# It used to be `group: verify-${{ github.ref }}` with `cancel-in-progress: true`,
# and that is right for the cheap Flutter lanes and wrong for everything that
# touches state outside this runner. A workflow-level cancellation kills EVERY
# job of the run, and a job's own `concurrency:` cannot opt out of it — so
# `db-gate`, whose serialized group exists precisely so two suites never
# overlap, was still being killed mid-suite by the next push. A killed run dies
# before its teardown and leaves its `E2E-<runId>` family behind for the orphan
# sweep to collect two hours later. That is the episode recorded in
# `docs/arquivamento-app.md`; this is its fix.
#
# So cancellation moved to the jobs that can afford it, and the ones that cannot
# queue instead:
#   · `verify` / `apk` / `e2e` — cancel: nothing outside the runner survives them
#     (the emulator lane keeps the ref-scoped group it had, no behaviour change);
#   · `db-gate` — its own repo-wide serialized group, never cancelled;
#   · `web-e2e` — cancels, as designed in PR 5: it invents its own family per run
#     and holds no fixed-id seed;
#   · `db-prod` / `deploy-web` — queue, never cancel. Killing a migration or a
#     publish half-way is a worse outcome than waiting for the one in front.

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # .fvmrc is the single source of truth for the Flutter version (locked
      # decision: version changes only by explicit owner decision on the board).
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Core — analyze + dart test
        working-directory: packages/entrelares_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      # The PostgREST row contracts (T-56 PR 6). They left `lib/models/` when
      # the ported database gate — pure Dart, no Flutter — became their second
      # reader, the same move `Entrelares.Models` → `Entrelares.DbContracts`
      # made in C#. Analyzed with the core's `--fatal-infos`, since a package
      # both the app and the gate compile against must not carry a warning
      # either of them would inherit.
      - name: Contracts — analyze
        working-directory: packages/entrelares_db_contracts
        run: |
          dart pub get
          dart analyze --fatal-infos

      - name: App — analyze + flutter test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # T-53 lote 6, tension 1 (owner, 19/08/2026): Flutter Web REPLACES the
      # PWA, so the web target is part of the gate — a build that only compiles
      # for Android would let the web channel rot silently. It is a compile, not
      # an emulator: ~1,5 min, cheap enough for every push.
      - name: Web — release build + first-load weight
        working-directory: app
        run: |
          flutter build web --release --no-web-resources-cdn
          echo "### Web first-load weight (gzip)" >> "$GITHUB_STEP_SUMMARY"
          for f in build/web/flutter_bootstrap.js build/web/main.dart.js build/web/canvaskit/canvaskit.wasm; do
            if [ -f "$f" ]; then
              kb=$(( $(gzip -c "$f" | wc -c) / 1024 ))
              echo "- $(basename "$f"): ${kb} KB" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # This is NOT the channel-acceptance number — that one was measured
          # on a real mid-range Android over 4G, against the PWA, and granted
          # by the owner on 23/08/2026. What this step keeps doing is guarding
          # it: the weight that drives the first load stays visible on every
          # push, so a regression is noticed the day it lands rather than the
          # day someone complains.

  # ── The DB gate ──────────────────────────────────────────────────────────
  # 225 tests over RLS, the SECURITY DEFINER RPCs, the triggers and the billing
  # ledger, run against the REAL dev project with a throwaway family. It is the
  # test layer that proves the invariant this product is built on — the client
  # MIRRORS, the database ENFORCES — and it moved here from `entrelares-app`,
  # which is being archived (`docs/arquivamento-app.md`).
  #
  # It arrived in C# and was PORTED to Dart suite by suite (T-56, PRs 6-16,
  # closed 24/08/2026). Each PR of that crossing translated a group and deleted
  # the C# classes it replaced IN THE SAME COMMIT, so the gate was never
  # uncovered, and `C# + Dart` stayed at 225 on every one of them — which is the
  # arithmetic that said nothing was lost on the way. The C# half, the .NET
  # toolchain step and the sum that watched them are gone with PR 16; the 225
  # are now all Dart, and `dart test`'s own report is the count.
  #
  # Runs on the same events as `verify` (and blocks `deploy-web` alongside it),
  # but in its own job: it carries its own Supabase serialization, so it costs
  # nothing to run beside the Flutter lane.
  db-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialized across the whole repo, unlike the per-ref group of the workflow.
    # The suite is safe to run twice at once for FAMILIES (each run invents its own
    # `E2E-<runId>` and the orphan sweep spares anything younger than 2h), but the
    # T-39 billing seeds use FIXED external ids (`sub_e2e_*`) — two runs overlapping
    # there delete and recreate each other's rows. Queue instead of racing.
    #
    # What `false` does NOT do is protect the job that is WAITING: GitHub keeps
    # exactly one pending entry per group, so a third claimant drops the queued
    # one. Such a job reports `cancelled` with no `steps` array — it never
    # started, so it is an eviction and not a verdict. Let the group drain and
    # re-run that run; never cancel another to get ahead. Three quick pushes to
    # one branch are enough to cause it (CLAUDE.md carries the full note).
    concurrency:
      group: db-gate
      cancel-in-progress: false
    # Job level so the steps can read them in their own `if` — `secrets` is not
    # readable from an `if`, `env` is (the same shape `deploy-web` uses).
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_DEV }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
    steps:
      - uses: actions/checkout@v4

      # ── T-29, kept: the gate runs against the schema the PR is proposing ────
      # In the app repo this was a separate step before the suite; here it is a
      # step of the SAME job on purpose. Making it a job would mean the gate had
      # to `needs:` it, and a `needs:` on a job that skips (push, schedule) skips
      # the dependent too unless every edge is wrapped in `always()` — a footgun
      # for something whose only requirement is "before the suite, same runner".
      #
      # PULL REQUESTS ONLY: the PR is this repo's staging stage (there is no `dev`
      # branch — a merge to `main` publishes production). By the time a change is
      # on `main`, its PR already put the schema on dev.
      - name: Instalar Supabase CLI
        if: github.event_name == 'pull_request' && env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v3
        with:
          # PINNED, like the app repo: resolving "latest" spends GitHub API quota
          # and has failed runs on rate limit. Bump deliberately, never implicitly.
          version: 2.105.0

      - name: Aplicar migrations e functions no DEV (antes do gate)
        if: github.event_name == 'pull_request' && env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          source .github/functions.sh
          retry supabase link --project-ref "$PROJECT_REF"
          retry supabase db push
          deploy_functions "$PROJECT_REF"

      - name: Dizer por que o schema não foi aplicado
        if: github.event_name == 'pull_request' && env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "### Schema NÃO aplicado no dev — o gate rodou contra o schema antigo" >> "$GITHUB_STEP_SUMMARY"
          echo "Faltam \`SUPABASE_ACCESS_TOKEN_DEV\`, \`SUPABASE_DB_PASSWORD_DEV\` e \`SUPABASE_PROJECT_REF_DEV\` neste repo. Enquanto isso, quem aplica migrations é o \`entrelares-app\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: DB gate (Dart) — regras de banco contra o projeto dev
        working-directory: packages/entrelares_db_gate
        env:
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_DEV }}
          # OPTIONAL: arms the positive billing-webhook tests. A missing secret
          # arrives empty, which the suite reads as absent and disarms those
          # cases — the same shape `deploy-web` gives the Cloudflare credentials.
          # Set `ASAAS_WEBHOOK_TOKEN_DEV` here to run them.
          E2E_ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN_DEV }}
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter expanded

  # T-54's E2E lane (opened by lote 3, the first two-user flow). It drives the
  # REAL app on an emulator against the DEV project, with the throwaway-family
  # pattern the web suite already pays for (`E2E-<runId>`, `@resend.dev`,
  # `purge_e2e_family` — whose double-signature guard lives in the DATABASE, so
  # a fixture bug cannot delete a real family). NOT on every push: scheduled
  # daily + on demand, because an emulator run is minutes-expensive.
  e2e:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run-e2e)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # KVM must be writable for a hardware-accelerated emulator; without it
      # the run falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The service_role key never enters the repo: it arrives as a secret and
      # reaches the fixture through --dart-define only.
      - name: E2E — two-user swap flow on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: app
          script: >-
            flutter test integration_test/swap_workflow_test.dart
            --flavor dev
            --dart-define=E2E_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_DEV }}
            --dart-define=E2E_PACK=${{ inputs.e2e-pack || 'p0' }}

      # Lote 4 — the account/family pack. A separate emulator step rather than
      # one file with both, so a failure names which surface broke and the two
      # families never share a run id.
      - name: E2E — account and family flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: app
          script: >-
            flutter test integration_test/account_flows_test.dart
            --flavor dev
            --dart-define=E2E_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_DEV }}
            --dart-define=E2E_PACK=${{ inputs.e2e-pack || 'p0' }}

  apk:
    if: github.event_name == 'workflow_dispatch' && inputs.build-apk
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Stage 3: flavors are mandatory. CI builds the DEV flavor only, and
      # DEBUG only: release signing reads the T-55 keystores from a local
      # key.properties (never in the repo nor in CI), so release builds are
      # local-by-construction — a release task here would fail fast on the
      # missing file.
      - name: Build debug APK (dev flavor, arm64)
        working-directory: app
        run: flutter build apk --debug --flavor dev --split-per-abi --target-platform android-arm64
      # 1-day retention: the 500 MB artifact quota is account-wide (T-50).
      # Glob: the flavor changes the APK filename (only one file matches).
      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-arm64-v8a-debug
          path: app/build/app/outputs/flutter-apk/app-*-debug.apk
          retention-days: 1

  # ── The flow gate (T-56, PR 5) ───────────────────────────────────────────
  # The Playwright suite (62 tests) dies with the UI it drives. This job runs the
  # SAME `integration_test` files the emulator lane runs, but in a headless
  # browser — and it exercises the web channel, the one whose QA found six
  # defects no Android run could have caught.
  #
  # MEASURED before being trusted (24/08/2026), because `flutter drive` on web
  # prints "All tests passed." whether or not anything ran, and a gate that
  # always opens looks exactly like a gate that is never challenged:
  #   · a probe with one passing and one deliberately failing test turned the job
  #     RED, naming the test and printing Expected/Actual — the harness reports;
  #   · the full pack costs ~6 s more than `p0`, which is one extra two-user
  #     test's worth of work — the tests execute;
  #   · 80 s (p0) / 87 s (full) end to end, ~41 s of it compilation, against the
  #     10-15 min of the emulator lane. Most of that difference is booting an
  #     emulator and installing an APK, neither of which the browser needs.
  #
  # THAT MEASUREMENT DID NOT COVER THE CASE THAT ACTUALLY HAPPENED (T-58,
  # discovered 25/08/2026 — the day AFTER this gate was trusted). Every bullet
  # above exercised a suite whose tests RAN: the probe proved the harness reports
  # a FAILING test, not that any test existed. `flutter drive` on web prints
  # "All tests passed." and exits 0 with ZERO tests too, so a `setUpAll` that
  # throws is indistinguishable from a green run and `set -euo pipefail` sees
  # nothing. This gate was born five days AFTER the bug that broke its
  # `setUpAll`: the green that justified letting it block production was empty
  # from the first run. Hypothesis 2 (the calendar) was confirmed and fixed in
  # #109.
  #
  # SINCE T-58 (12/09/2026) THE GATE HAS TO PROVE IT RAN. Each suite records
  # the tests that reached their end (`integration_test/e2e_proof.dart`), the
  # driver is our own (`test_driver/integration_test.dart`) and refuses a run
  # that reported nothing, zero tests, or a count other than the one this job
  # demands through `E2E_EXPECTED_TESTS` — and it writes what ran to
  # `build/e2e_proof.json`, which the summary prints by name. The counts below
  # are MIRRORED by `web_channel_test` against the `testWidgets(` declarations
  # of each suite per pack, so a new test bumps them in the cheap lane before
  # it ever reaches this one. Validated the hard way: the same drive without the
  # service-role key — a `setUpAll` that throws, the exact 25/08 shape — went
  # green in 90 s before the guard and RED, naming the empty report, after it.
  #
  # It does NOT replace the emulator lane: what needs a device — Play Billing,
  # the share sheet, the native print dialog — only runs there.
  #
  # It BLOCKS the web publish (owner decision, 24/08/2026, on five green runs and
  # one deliberately red). That is the role the Playwright suite used to play for
  # the old repo's promotion, and it is what makes this a gate rather than a
  # report: a broken flow now stops the channel instead of reaching users. The
  # cost is accepted with it — a flaky run here holds a deploy, and the answer to
  # a red is to read it, never to re-run until it passes.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # Its OWN group, not `db-gate`'s: both drive the dev project, but they do
      # not collide — each invents its own `E2E-<runId>` family and both orphan
      # sweeps spare anything younger than 2h. Sharing a group would only
      # serialize them and lengthen every PR's critical path.
      group: web-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      # The runner image ships Chrome and a matching chromedriver; using them
      # avoids adding a third-party action to the supply chain for a spike.
      - name: Locate Chrome and chromedriver
        run: |
          echo "chrome: $(google-chrome --version 2>/dev/null || echo AUSENTE)"
          echo "chromedriver: $(chromedriver --version 2>/dev/null || echo AUSENTE)"
          command -v chromedriver >/dev/null || { echo "::error::chromedriver não está no PATH do runner"; exit 1; }

      - name: Drive integration_test in a headless Chrome
        working-directory: app
        env:
          E2E_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_DEV }}
          E2E_PACK: ${{ inputs.e2e-pack || 'p0' }}
        run: |
          set -euo pipefail
          flutter pub get
          chromedriver --port=4444 &
          for i in $(seq 1 20); do curl -sf http://localhost:4444/status >/dev/null && break; sleep 1; done
          echo "### Gate de fluxo (web) — pack $E2E_PACK" >> "$GITHUB_STEP_SUMMARY"
          # One invocation per target: `flutter drive` takes a single target and
          # each one pays its own ~40 s compile. The first two files are the SAME
          # ones the emulator lane runs; `deep_link_test` is the exception T-64
          # bought — a cold entry into an inner URL only misbehaves where the
          # browser hands the app its own address, so that one is web-only by
          # construction and the emulator lane does not run it.
          #
          # T-58: `<target>:<p0 count>:<full count>` — the number of tests each
          # pack must PROVE it ran, handed to the driver as E2E_EXPECTED_TESTS.
          # `web_channel_test` mirrors these against the suites' `testWidgets(`
          # declarations, so a new test bumps them in the cheap lane first. The
          # proof file is removed BEFORE each drive: a stale one from the previous
          # target must never stand in for a missing one.
          for spec in swap_workflow_test:1:2 account_flows_test:1:3 deep_link_test:4:4; do
            IFS=: read -r target p0 full <<< "$spec"
            expected="$p0"
            if [ "$E2E_PACK" = full ]; then expected="$full"; fi
            rm -f build/e2e_proof.json
            start=$(date +%s)
            E2E_EXPECTED_TESTS="$expected" flutter drive \
              --driver=test_driver/integration_test.dart \
              --target="integration_test/$target.dart" \
              -d web-server --browser-name=chrome --headless \
              --dart-define=E2E_SUPABASE_SERVICE_ROLE_KEY="$E2E_KEY" \
              --dart-define=E2E_PACK="$E2E_PACK"
            # The driver exits 1 without a proof; this is the belt to that brace,
            # for a driver that died before writing one.
            [ -f build/e2e_proof.json ] || { echo "::error title=T-58::$target terminou sem build/e2e_proof.json — nada prova que a suíte rodou"; exit 1; }
            ran=$(jq -r ".executed | length" build/e2e_proof.json)
            names=$(jq -r '.executed | join("; ")' build/e2e_proof.json)
            echo "- $target: $(( $(date +%s) - start ))s — $ran/$expected teste(s) provado(s): $names" >> "$GITHUB_STEP_SUMMARY"
          done

  # ── Production database ──────────────────────────────────────────────────
  # T-29's order, preserved across the move: migrations → functions → app. This
  # job sits between the gates and `deploy-web`, so a failed `db push` stops the
  # publish and the environment is never left with a new app over an old schema.
  #
  # This is where this repo gained write access to the PRODUCTION database
  # (24/08/2026, owner decision — `docs/arquivamento-app.md`). It runs only from
  # `main`, only after BOTH gates are green, and the credentials are three secrets
  # that exist nowhere else in the workflow.
  db-prod:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [verify, db-gate]
    runs-on: ubuntu-latest
    # Queue, never cancel: a `db push` interrupted between two migrations leaves
    # production half-applied, and no later run can tell that from a clean state.
    concurrency:
      group: db-prod
      cancel-in-progress: false
    env:
      # Account-scoped tokens; two named ones (ci-qa/ci-prod) give separate
      # revocation and audit per pipeline.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PROD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v3
        with:
          version: 2.105.0

      - name: Aplicar migrations e functions em PRODUÇÃO
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          source .github/functions.sh
          retry supabase link --project-ref "$PROJECT_REF"
          retry supabase db push
          deploy_functions "$PROJECT_REF"

      # Self-disarming until the owner moves the credentials, so `main` does not
      # go red for a piece of ops that has not happened yet. The note is loud on
      # purpose: while this step is the one that runs, schema and app do NOT
      # travel together, and the `entrelares-app` pipeline is still what applies
      # migrations to production.
      - name: Dizer por que o banco de produção não foi tocado
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "### Banco de PRODUÇÃO não tocado por este repo" >> "$GITHUB_STEP_SUMMARY"
          echo "Faltam \`SUPABASE_ACCESS_TOKEN_PROD\`, \`SUPABASE_DB_PASSWORD_PROD\` e \`SUPABASE_PROJECT_REF_PROD\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Enquanto isso quem aplica migrations em produção é o \`entrelares-app\`, e **schema e app não viajam juntos** — ver \`docs/arquivamento-app.md\`." >> "$GITHUB_STEP_SUMMARY"

  # ── T-53 stage 4 — the web channel ──────────────────────────────────────
  # Flutter Web REPLACES the Blazor PWA (tension 1), so this repo owns the
  # deploy of `web.entrelares.app`. Cloudflare Pages, the same platform and the
  # same account the Blazor app has always used, in its OWN project so the two
  # clients can be swapped by moving a custom domain — which is what keeps the
  # rollback of the cutover a dashboard action instead of a release.
  #
  # Three flags carry the whole cutover contract and none of them is optional:
  #   --dart-define=APP_ENV=prod  `flutter build web` accepts NO `--flavor`, so
  #                               without this the production hostname would be
  #                               built against the QA project (`web_channel_test`
  #                               fails the build if it disappears).
  #   --no-web-resources-cdn      CanvasKit from THIS origin: no gstatic request
  #                               on the first load, and a CSP that needs no
  #                               third-party host.
  #   --release                   the only build a user may ever receive.
  deploy-web:
    if: github.event_name == 'push' && github.ref_name == 'main'
    # THREE gates and one deploy, in this order, and each edge was added the day
    # its absence would have cost something:
    #   · `verify`   — the Flutter suites (unit, widget, web compile);
    #   · `db-gate`  — the 225 database rules, since publishing behind only the
    #     Flutter half would ship a channel whose server rules nobody checked;
    #   · `web-e2e`  — the flow gate (24/08/2026), the role Playwright played for
    #     the old repo's promotion: a broken two-user flow stops the channel;
    #   · `db-prod`  — T-29's order, migrations → functions → app, so the channel
    #     never serves an app whose schema failed to apply.
    needs: [verify, db-gate, web-e2e, db-prod]
    runs-on: ubuntu-latest
    # Queue, never cancel — same reason as `db-prod`, one step later: a publish
    # killed mid-upload can leave the channel serving a half-written build.
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    # Job level on purpose: this is what the publish step reads in its own
    # `if`, and a step cannot reliably test the `env:` it declares itself.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # T-66 (PR 3): the sourcemap upload, self-disarming like the publish
      # below. Org and project are NOT secrets — the DSN in `env.dart` already
      # names the same account in public.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: irineu-pinheiro
      SENTRY_PROJECT: entrelares-app
      # T-68: the host the smoke check reads back. Not a secret and not a
      # guess — `web_channel_test` pins it against `Env.prod.webHostname`, the
      # same string the app believes it is served from.
      WEB_HOSTNAME: web.entrelares.app
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      # `--source-maps` (T-66, PR 3) is what makes a web crash READABLE. Without
      # it dart2js frames name `main.dart.js` offsets and a Sentry issue from
      # this channel groups and counts correctly while saying nothing about
      # where it happened. The maps are uploaded to Sentry below and then
      # DELETED before publishing — see that step for why.
      - name: Build web (production config)
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --source-maps --dart-define=APP_ENV=prod
      # The release name MUST be the string the client puts in its events
      # (`CrashReporter.release`), or Sentry has artifacts nobody asks for.
      # Read from the pubspec rather than repeated here, for the same reason
      # `env_version_test` exists.
      - name: Name the release, exactly as the app does
        id: release
        run: |
          version=$(grep -m1 '^version:' app/pubspec.yaml | awk '{print $2}')
          echo "name=entrelares-app@$version" >> "$GITHUB_OUTPUT"
      # Self-DISARMING, the same shape as the publish step below: with no token
      # the deploy proceeds and says the stacks will read minified, instead of
      # painting `main` red for ops that has not happened yet.
      #
      # No `sourcemaps inject`: it stamps debug ids into the bundle AND expects
      # the events to carry them back, which a hand-written client does not
      # send. Matching here is by RELEASE + url, which is why the two strings
      # above have to agree.
      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        working-directory: app
        run: |
          npm install -g @sentry/cli
          sentry-cli releases new "${{ steps.release.outputs.name }}"
          sentry-cli sourcemaps upload build/web --release "${{ steps.release.outputs.name }}" --url-prefix '~/' --validate
          sentry-cli releases finalize "${{ steps.release.outputs.name }}"
      - name: Say why the web stacks will read minified
        if: env.SENTRY_AUTH_TOKEN == ''
        run: |
          echo "### Source maps: upload PULADO" >> "$GITHUB_STEP_SUMMARY"
          echo "Falta o secret \`SENTRY_AUTH_TOKEN\` neste repo. O canal web segue reportando crash; as stacks é que saem minificadas (runbook §13.6)." >> "$GITHUB_STEP_SUMMARY"
      # ALWAYS, token or no token, and always BEFORE the publish: a `.map` file
      # served from our own origin hands the whole Dart source to anyone who
      # asks for it. Sentry already has its copy — the maps have no reason to
      # exist on the CDN, and the browser never needs them.
      - name: Strip source maps before publishing
        working-directory: app
        run: |
          count=$(find build/web -name '*.map' | wc -l)
          find build/web -name '*.map' -delete
          # dart2js also leaves a `//# sourceMappingURL=` line pointing at the
          # file just deleted. Harmless, but it makes every devtools session
          # fetch a 404 and read like a broken deploy. Removed here, AFTER the
          # upload, and it is the last line of the bundle — nothing above it
          # moves, so the maps Sentry holds still line up.
          find build/web -name '*.js' -exec sed -i '/^\/\/# sourceMappingURL=/d' {} +
          echo "Source maps stripped from the published bundle: $count" >> "$GITHUB_STEP_SUMMARY"
      # T-68 — the marker that makes the publish PROVABLE, written into the
      # bundle just before it goes up. The commit sha and not `version.json`:
      # the version only moves when the pubspec does, so a delivery that does
      # not bump it (T-69 was a pure rename) would publish nothing and still
      # match. Published at the root, uncached by the Pages default measured on
      # `version.json` (`max-age=0, must-revalidate`), and read back by
      # `smoke_web.sh` after the deploy.
      - name: Stamp the bundle with the commit being published
        working-directory: app
        run: |
          printf '%s' "$GITHUB_SHA" > build/web/build-id.txt
          echo "Marcador publicado: \`$GITHUB_SHA\` em /build-id.txt" >> "$GITHUB_STEP_SUMMARY"
      # Wrangler, as in the app repo. The Pages project name is IMMUTABLE once
      # created (a lesson the F-54 rebrand paid for), so it is pinned here and
      # created by the owner before the first run.
      - name: Install Wrangler
        run: npm install -g wrangler
      # Self-DISARMING while the Cloudflare credentials do not exist in this
      # repo — the same shape the app repo gives `E2E_ASAAS_WEBHOOK_TOKEN`: an
      # absent secret arrives empty and the step skips instead of painting
      # `main` red for a piece of ops that has not happened yet. The build
      # above still runs on every push, so the channel cannot rot silently.
      # (`secrets` is not readable from a job-level `if`; `env` is, from a
      # step-level one.)
      - name: Publish to Cloudflare Pages
        working-directory: app
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: wrangler pages deploy build/web --project-name=entrelares-web --branch=main --commit-dirty=true
      # T-68 — exit code 0 is not proof. This fetches the published site and
      # asserts it is serving the commit stamped above; a publish that succeeded
      # loudly and delivered nothing goes RED here, which is what makes the
      # `ops-alert` job below fire. See `smoke_web.sh` for why it compares the
      # BODY and never the status: `_redirects` answers 200 with `index.html`
      # for a file that is not there, so a `curl -f` check would pass over the
      # void.
      - name: Prove the channel is serving THIS commit
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bash .github/smoke_web.sh "https://${{ env.WEB_HOSTNAME }}" "$GITHUB_SHA"
      - name: Say why nothing was published
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "### Canal web: build OK, publicação PULADA" >> "$GITHUB_STEP_SUMMARY"
          echo "Faltam os secrets \`CLOUDFLARE_API_TOKEN\` e \`CLOUDFLARE_ACCOUNT_ID\` neste repo (e o projeto Pages \`entrelares-web\`)." >> "$GITHUB_STEP_SUMMARY"

  # ── T-68 — a failed publish reaching a human ────────────────────────────
  # `main` is production and there is no rollback, so the loud failure is
  # already covered: a merge that breaks reaches users as a broken app. The
  # INVERSE was invisible — a merge that silently does NOT publish. On
  # 10/09/2026 `db-prod` failed, `deploy-web` was skipped, and the web channel
  # stopped publishing; it was noticed only because someone happened to be
  # watching the run of a DOCUMENTATION PR.
  #
  # MEASURED FIRST, per the card: GitHub's own failure e-mail DID arrive, 20
  # seconds after the run concluded. What it cannot do is stand out — in those
  # three days it sent 13 CI-failure mails, 10 of them routine PR noise, and the
  # one that meant "production stopped publishing" looked like all the others.
  # So this job does not duplicate that e-mail; it gives the event a destination
  # that already means production (Sentry, T-66 — runbook §13.5) and a durable
  # record that stays open until a human closes it (a GitHub issue).
  #
  # `cancelled` deliberately does NOT alert. A cancelled `db-gate` is usually an
  # EVICTION from its depth-1 queue (§5), a documented false alarm — and an
  # alarm that cries wolf is how the next real one gets ignored. Hence
  # `contains(needs.*.result, 'failure')` rather than `failure()`.
  ops-alert:
    if: >-
      always() && github.event_name == 'push' && github.ref_name == 'main'
      && contains(needs.*.result, 'failure')
    needs: [verify, db-gate, web-e2e, db-prod, deploy-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      # PUBLIC by construction: a Sentry DSN can only WRITE events, which is why
      # it ships in every browser that loads the web channel. `web_channel_test`
      # pins this string against `Env.prod.sentryDsn` so the two cannot drift —
      # and the PRODUCTION project on purpose: the dev project's alert rule is
      # disabled (runbook §13.5), so an alert sent there wakes nobody.
      SENTRY_DSN_PROD: https://207fdf4ae55dd391583ecaa369b3319b@o4511910022217728.ingest.us.sentry.io/4512066983231488
    steps:
      - uses: actions/checkout@v4
      - name: Name the jobs that failed
        id: failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jobs=$(printf '%s' "$NEEDS" \
            | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")')
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "### 🚨 \`main\` vermelha — o canal web NÃO publicou" >> "$GITHUB_STEP_SUMMARY"
          echo "Falharam: \`$jobs\`. O merge \`${GITHUB_SHA:0:7}\` não chegou a \`web.entrelares.app\`." >> "$GITHUB_STEP_SUMMARY"
      # The alert. Sentry's project alert rule ("high priority issues") e-mails
      # the owner — measured 11/09/2026 with a probe event of this exact shape:
      # 46 seconds from POST to inbox, subject carrying `PipelineFailure`.
      - name: Alertar no Sentry de produção
        run: |
          bash .github/ops_alert.sh \
            "$SENTRY_DSN_PROD" \
            "${{ steps.failed.outputs.jobs }}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$GITHUB_SHA"
      # The durable record. An e-mail is read once and scrolls away; this stays
      # OPEN until a human closes it, which is what a "production is not
      # publishing" item needs. `always()` so a Sentry outage does not take the
      # record down with it.
      - name: Abrir (ou atualizar) o registro do incidente
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOBS: ${{ steps.failed.outputs.jobs }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          marker="🚨 main vermelha em $short"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jobs="${FAILED_JOBS:-desconhecidos}"
          existing=$(gh issue list --state open --limit 50 --json number,title \
            --jq "map(select(.title | startswith(\"$marker\"))) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Nova tentativa, mesma falha: \`$jobs\` — $run_url"
            echo "Registro atualizado: #$existing"
          else
            gh issue create \
              --title "$marker — o canal web não publicou" \
              --body "$(printf '%s\n' \
                "O merge \`$short\` foi para \`main\` e **não chegou a \`web.entrelares.app\`**." \
                "" \
                "- Jobs vermelhos: \`$jobs\`" \
                "- Run: $run_url" \
                "- O canal segue servindo o build ANTERIOR até que isto seja corrigido e o run refeito." \
                "" \
                "Se o job vermelho for \`db-prod\` ou \`db-gate\` e a falha vier de *Authorization failed for the access token and project ref pair*, é o par de tokens do Supabase — \`SUPABASE_ACCESS_TOKEN_DEV\` e \`SUPABASE_ACCESS_TOKEN_PROD\` são secrets DIFERENTES e rotacionar um não conserta o outro (Decisões vigentes, \"Tests, gates and CI\")." \
                "" \
                "Fechar esta issue quando um run verde em \`main\` tiver publicado — o passo *Prove the channel is serving THIS commit* é a evidência." )"
          fi
